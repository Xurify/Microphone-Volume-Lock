name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, for example 1.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check version
        shell: pwsh
        run: |
          $json = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($json -ne $env:VERSION) { throw "wails.json has $json, not $env:VERSION" }
          if (-not (Select-String -Path main.go -SimpleMatch "var version = `"$env:VERSION`"")) {
            throw "main.go does not have version $env:VERSION"
          }
          if (-not (Test-Path ".github/release-notes/v$env:VERSION.md")) {
            throw "Missing .github/release-notes/v$env:VERSION.md"
          }

      - name: Test
        run: go test ./internal/...

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
              choco install nsis -y --no-progress
            }
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build
        run: wails build -platform windows/amd64 -nsis -trimpath -skipbindings

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "build/bin/MicrophoneVolumeLock-amd64-installer.exe", "build/bin/MicrophoneVolumeLock.exe"
          $sums = $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf)
          }
          $fence = '```'
          $notes = (Get-Content ".github/release-notes/v$env:VERSION.md" -Raw).TrimEnd() +
            "`n`nSHA-256:`n" + $fence + "`n" + ($sums -join "`n") + "`n" + $fence + "`n"
          $notes | Out-File release-notes.md -Encoding utf8
          gh release create "v$env:VERSION" @files --target $env:GITHUB_SHA `
            --title "Microphone Volume Lock v$env:VERSION" --notes-file release-notes.md
